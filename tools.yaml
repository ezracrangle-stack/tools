# Google Analytics measurement ID for tools.ezrasnotes.com. Empty turns Analytics off.
ga_id: "G-FTNNLB6W9D"

# Google Apps Script web app that receives "Send to Ezra" calculations and testimonials
# into Ezra's private Google Sheet. Empty hides those buttons.
collect_url: "https://script.google.com/macros/s/AKfycbz-a4q03dY00RYGWBKOHaKqYKL92Z3afAqhJ5iYdPQGYCMbU2CpFTR-JfEfArbdoUZXHg/exec"

# Old addresses sent to their new page (old: new).
redirects:
  cscore: red-flags

# Every tool on the site. The home page list is built from this file.
# status: live (has a page) or soon (shows as "Coming soon").
# To add a tool, see COMO-AGREGAR-UNA-HERRAMIENTA.md.

tools:
  - slug: net-net
    og_title: "Net-net"
    og_sub: "Benjamin Graham"
    og: "Graham's net current asset value and net cash per share, against the price."
    share: "the net-net calculator"
    name: Net-net calculator
    nav: Net-net
    status: live
    blurb: Graham's NCAV, modern NCAV, net cash, Schloss' working capital and book value, per share and against the price.

  - slug: epv
    og_title: "EPV"
    og_sub: "Phil Oakley"
    og: "Phil Oakley's earnings power value, owner earnings and the most to pay."
    share: "the earnings power value calculator"
    name: Earnings power value
    nav: EPV
    status: live
    blurb: What the business is worth if today's cash profits never grow, how much of the price is a bet on growth, and the most you should pay.

  - slug: greenwald
    og_title: "Moat test"
    og_sub: "Bruce Greenwald"
    og: "Asset value, earnings power value and what the gap says about the moat."
    share: "Greenwald's moat test"
    name: Greenwald's moat test
    nav: Greenwald
    status: live
    blurb: Greenwald's test. What it would cost to rebuild the business, what its earnings are worth with no growth, and what the gap says about its moat.

  - slug: penman
    og_title: "Residual income"
    og_sub: "Stephen Penman"
    og: "Residual income: the growth the price implies and the return you earn."
    share: "Penman's residual income model"
    name: Penman's residual income
    nav: Penman
    status: live
    blurb: Anchor on the book value of the operations, then see the growth the price implies and the return you earn at today's price.

  - slug: graham
    og_title: "Graham's formulas"
    og_sub: "The Intelligent Investor"
    og: "The growth formula, the Graham number and the seven defensive tests."
    share: "Graham's formulas"
    name: Graham's formulas
    nav: Graham
    status: live
    blurb: Graham's growth formula, the Graham number and his seven tests for the defensive investor, as he wrote them in The Intelligent Investor.

  - slug: fcf
    og_title: "Free cash flow"
    og_sub: "Mauboussin and Callahan"
    og: "Free cash flow after stock pay and leases, and how much a company invests."
    share: "Mauboussin's FCF"
    name: Mauboussin's FCF
    nav: Mauboussin
    status: live
    blurb: Mauboussin and Callahan's fixes to the cash flow statement. Free cash flow after stock pay and leases, and how much the company really invests.

  - slug: roic
    og_title: "ROIC and reinvestment"
    og_sub: "Returns on capital"
    og: "Return on invested and incremental capital, and the reinvestment rate."
    share: "the ROIC, ROIIC and reinvestment calculator"
    name: ROIC, ROIIC and reinvestment
    nav: ROIC
    status: live
    blurb: How much a business earns on its capital, what the new capital earns, how much it reinvests, and the growth that supports.

  - slug: reverse-dcf
    og_title: "Reverse DCF"
    og_sub: "Mauboussin and Rappaport"
    og: "Start from the share price and see what it assumes."
    share: "a reverse DCF"
    name: Reverse DCF
    nav: Reverse DCF
    status: live
    blurb: How many years of above-cost returns the price already assumes, and the sales growth it needs. Mauboussin and Rappaport's method, with your own numbers.

  - slug: compounders
    og_title: "What to pay for quality"
    og_sub: "The Compounders"
    og: "What P/E to pay for a business that reinvests at high returns."
    share: "the Compounders' price matrix"
    name: What to pay for quality
    nav: Compounders
    status: live
    blurb: How much more than the market you can pay for a business that reinvests at high returns, and the P/E that still earns your target. From The Compounders.

  - slug: dhandho
    og_title: "Dhandho bet"
    og_sub: "Mohnish Pabrai"
    og: "The edge, the chance of losing money and the Kelly bet size."
    share: "Pabrai's Dhandho bet sizer"
    name: Pabrai's Dhandho bet
    nav: Pabrai
    status: live
    blurb: Write down what can happen and how likely it is. Get the odds, the chance of losing money, and how much of your bankroll the Kelly Formula says to bet. From The Dhandho Investor.

  - slug: lynch
    og_title: "PEG"
    og_sub: "Peter Lynch"
    og: "The PEG, the dividend-adjusted version and the P/E without net cash."
    share: "Peter Lynch's PEG calculator"
    name: Peter Lynch's PEG
    nav: Lynch
    status: live
    blurb: The PEG and its dividend-adjusted version, the P/E without the company's net cash, and what ten years of compounding does to the price. From One Up on Wall Street.

  - slug: marks
    og_title: "Market temperature"
    og_sub: "Howard Marks"
    og: "The market's temperature from 23 pairs of opposites."
    share: "Howard Marks' market temperature check"
    name: Howard Marks' market temperature
    nav: Marks
    status: live
    blurb: Twenty-three pairs of opposites, from lenders to investors to funds. Pick a side for each and take the market's temperature, as Howard Marks does in Mastering the Market Cycle.

  - slug: intangibles
    og_title: "Intangibles"
    og_sub: "Mauboussin and Callahan"
    og: "Count intangible investment as investment and see earnings and P/E change."
    share: "the intangibles and earnings calculator"
    name: Intangibles and earnings
    nav: Intangibles
    status: live
    blurb: What a company really earns once its spending on brands, customers and R&D counts as investment, by industry. From Mauboussin and Callahan's Intangibles and Earnings.

  - slug: capital-allocation
    og_title: "Capital allocation"
    og_sub: "Mauboussin and Callahan"
    og: "Where a company's cash came from, where it went, and what went back to shareholders."
    share: "the capital allocation calculator"
    name: Capital allocation calculator
    nav: Capital allocation
    status: live
    blurb: Where a company's cash came from and where it went over 5 years, what each $1 of new sales cost in investment, and how much went back to shareholders.

  - slug: buybacks
    og_title: "Buybacks and stock comp"
    og_sub: "Mauboussin and Callahan"
    og: "How much stock a company issues and buys back, and who wins from a buyback."
    share: "the buybacks and stock comp calculator"
    name: Buybacks and stock comp
    nav: Buybacks
    status: live
    blurb: How much stock a company issues to pay its people and how much it buys back, against Mauboussin and Callahan's medians, and who wins from a buyback.

  - slug: moat
    og_title: "Measuring the moat"
    og_sub: "Mauboussin and Callahan"
    og: "ROIC split into margin and turnover, and how much market shares move."
    share: "the Measuring the Moat calculator"
    name: Measuring the moat
    nav: Moat
    status: live
    blurb: Where a company's ROIC comes from, margin or turnover, against its peers, and how much market shares move in its industry. From Mauboussin and Callahan's Measuring the Moat.

  - slug: red-flags
    og_title: "Red flags"
    og_sub: "Montier, Beneish and Schilit"
    og: "Montier's C-Score, Beneish's M-Score and checks from Financial Shenanigans."
    share: "the red flags check"
    name: Red flags
    nav: Red flags
    status: live
    blurb: Is the company dressing up its numbers? Montier's C-Score, Beneish's M-Score and four checks from Financial Shenanigans, on two years of accounts.

  - slug: beauty-contest
    og_title: "Beauty contest"
    og_sub: "Keynes and Montier"
    og: "Pick a number from 0 to 100. Closest to two-thirds of the average wins."
    share: "Keynes' beauty contest"
    name: Keynes' beauty contest
    nav: Beauty contest
    status: live
    blurb: A monthly game. Pick a number from 0 to 100; the winner is closest to two-thirds of everyone's average. How far ahead of the crowd can you think?




# The net-net calculator, row by row, in the same order as Ezra's Excel template.
# type: head (section title), input, calc (calculated line), result (total + per share),
#       ratio (price / per share), test (passes or fails).
# k is the short name used in shared links. kind: money, shares, price, percent, number.
net_net_rows:
  - {type: head, label: "Balance sheet"}
  - {type: input, k: c,  label: "Cash & Equivalents", kind: money}
  - {type: input, k: s,  label: "Short-term Investments", kind: money}
  - {type: input, k: r,  label: "Restricted Cash", kind: money, hint: "Counts, even if it isn't available for daily operations."}
  - {type: calc,  k: totalCash, label: "Total Cash", hint: "Cash & Equivalents + Short-term Investments + Restricted Cash"}
  - {type: input, k: ar, label: "Total Receivables", kind: money, hint: "Accounts + other + notes receivable."}
  - {type: input, k: in, label: "Inventory", kind: money}
  - {type: input, k: pp, label: "Prepaid Expenses", kind: money}
  - {type: input, k: ca, label: "Total Current Assets", kind: money, key: true}
  - {type: calc,  k: otherCA, label: "Other Current Assets", hint: "Total Current Assets minus the lines above."}
  - {type: input, k: a,  label: "Total Assets", kind: money, hint: "Only used for book value."}
  - {type: input, k: g,  label: "Goodwill", kind: money, hint: "Only used for adjusted book value."}
  - {type: input, k: ia, label: "Intangible Assets", kind: money, hint: "Only used for adjusted book value."}
  - {type: input, k: rou, label: "Right-of-use Assets", kind: money, hint: "Operating lease assets. Only used for adjusted book value."}
  - {type: input, k: cl, label: "Total Current Liabilities", kind: money}
  - {type: input, k: d,  label: "Long-Term Debt", kind: money}
  - {type: input, k: l,  label: "Total Liabilities", kind: money, key: true}
  - {type: input, k: ob, label: "Off-Balance Sheet Liabilities", kind: money, hint: "Unfunded pensions, guarantees, litigation. Read the notes."}
  - {type: input, k: pf, label: "Preferred Stock", kind: money, hint: "Face value."}
  - {type: head, label: "Market"}
  - {type: input, k: sh, label: "Shares Outstanding", kind: shares, key: true}
  - {type: input, k: p,  label: "Current Stock Price", kind: price, key: true, hint: "Per share, in full. Never in thousands."}
  - {type: input, k: mc, label: "Market Cap", kind: money, hint: "Leave blank to use shares × price."}
  - {type: input, k: ev, label: "EV", kind: money, hint: "Leave blank for market cap + debt + preferred − total cash."}
  - {type: head, label: "Results", columns: true}
  - {type: result, k: ncav, label: "Ben Graham's NCAV", hint: "Current Assets − Total Liabilities"}
  - {type: ratio,  k: ncav, label: "P/NCAV"}
  - {type: result, k: adj, label: "Modern NCAV", hint: "Current Assets − (Total Liabilities + Off-Balance Sheet Liabilities + Preferred Stock)"}
  - {type: ratio,  k: adj, label: "Modern P/NCAV"}
  - {type: result, k: netCash, label: "Net Cash", hint: "Total Cash − Total Liabilities"}
  - {type: ratio,  k: netCash, label: "P/Net Cash"}
  - {type: result, k: wc, label: "Working Capital", hint: "Current Assets − Current Liabilities"}
  - {type: result, k: schloss, label: "Walter Schloss' WC", hint: "Current Assets − Current Liabilities − Long-Term Debt"}
  - {type: result, k: bv, label: "Book Value", hint: "Total Assets − Total Liabilities"}
  - {type: ratio,  k: bv, label: "P/B"}
  - {type: result, k: abv, label: "Adjusted Book Value", hint: "(Total Assets − Goodwill − Intangible Assets − Right-of-use Assets) − Total Liabilities"}
  - {type: ratio,  k: abv, label: "Adjusted P/B"}
  - {type: head, label: "Net net working capital", columns: true}
  - {type: input, k: ar_h, label: "Receivables taken at (%)", kind: percent, default: 75}
  - {type: input, k: in_h, label: "Inventory taken at (%)", kind: percent, default: 50}
  - {type: result, k: nnwc, label: "Net Net Working Capital", hint: "Total Cash + Receivables × haircut + Inventory × haircut − Total Liabilities"}
  - {type: ratio,  k: nnwc, label: "P/NNWC"}
  - {type: head, label: "Your test"}
  - {type: input, k: max, label: "Your max P/NCAV", kind: number, default: 0.66, hint: "Graham bought at 0.66 or less. Many investors today accept anything under 1."}
  - {type: test, k: graham, label: "Graham NCAV test"}
  - {type: test, k: modern, label: "Modern NCAV test"}

# The EPV calculator (Phil Oakley's method), row by row, in the same order as Oakley_EPV_Template.xlsx.
# signed: true lets a field take negative numbers.
epv_rows:
  - {type: head, label: "Market data"}
  - {type: input, k: sh, label: "Shares outstanding (latest)", kind: shares, key: true, hint: "Used for EPV per share."}
  - {type: input, k: wsh, label: "Weighted average diluted shares", kind: shares, hint: "Optional. Used for owner earnings per share. Blank = shares outstanding."}
  - {type: input, k: p, label: "Share price", kind: price, key: true, hint: "Per share, in full. Never in thousands."}

  - {type: head, label: "1. Normalized EBIT"}
  - {type: input, k: ebit, label: "Average EBIT (5 years) or latest underlying EBIT", kind: money, key: true, signed: true, hint: "A 5-year average smooths out one good or bad year."}
  - {type: helper, id: epv-ebit}
  - {type: note, label: "One-offs, averaged over the same years. Costs as positive (they get added back), gains as negative."}
  - {type: input, k: rs, label: "Restructuring costs", kind: money, signed: true}
  - {type: input, k: imp, label: "Impairments and write-downs", kind: money, signed: true}
  - {type: input, k: iw, label: "Inventory write-offs", kind: money, signed: true}
  - {type: input, k: tc, label: "Transaction costs", kind: money, signed: true}
  - {type: input, k: ls, label: "Legal settlements (net)", kind: money, signed: true, hint: "A net gain goes in as negative."}
  - {type: input, k: gs, label: "Gains (−) / losses (+) on asset sales", kind: money, signed: true}
  - {type: input, k: oo, label: "Other one-offs", kind: money, signed: true, hint: "If a one-off shows up most years, it isn't one. Leave it in EBIT."}
  - {type: total, k: nebit, label: "Normalized EBIT", hint: "Average EBIT + one-offs"}

  - {type: head, label: "2. Cash profits"}
  - {type: input, k: da, label: "Depreciation & amortization (D&A)", kind: money, key: true, hint: "Latest year, from the cash flow statement."}
  - {type: input, k: mcx, label: "Maintenance capex", kind: money, key: true, hint: "What it costs to keep the business as it is. If the company doesn't say, Oakley uses the higher of the 5- and 10-year average capex. 120% of D&A is a rougher shortcut."}
  - {type: helper, id: epv-capex}
  - {type: input, k: lease, label: "Lease payments", kind: money, hint: "Optional, for IFRS 16 reporters: their D&A includes the depreciation of leased assets, so take off the rent actually paid. If you fill this, leave lease liabilities out of debt."}
  - {type: calc, k: pre, label: "Pre-tax cash profits", hint: "Normalized EBIT + D&A − maintenance capex − lease payments"}
  - {type: input, k: tax, label: "Tax rate (%)", kind: percent, default: 25, hint: "If the effective rate is below the statutory rate, Oakley uses the statutory one."}
  - {type: total, k: cp, label: "After-tax cash profits", hint: "This is the company's earnings power."}

  - {type: head, label: "3. Earnings power value"}
  - {type: input, k: r, label: "Required rate of return (%)", kind: percent, default: 9, hint: "Oakley's guide: large, steady companies 7-9%. Smaller or indebted ones 10-12%. Very small and risky, 15% or more."}
  - {type: calc, k: ev, label: "Enterprise value", hint: "After-tax cash profits ÷ required rate"}
  - {type: input, k: debt, label: "(−) Debt", kind: money}
  - {type: input, k: pen, label: "(−) Pension deficit", kind: money}
  - {type: input, k: pref, label: "(−) Preferred equity", kind: money}
  - {type: input, k: mi, label: "(−) Minority interests", kind: money}
  - {type: input, k: cash, label: "(+) Surplus cash", kind: money, hint: "Cash the business doesn't need to operate."}
  - {type: total, k: epv, label: "EPV (equity)"}
  - {type: total, k: epvps, label: "EPV per share"}
  - {type: calc, k: epvpct, label: "EPV as % of the share price", hint: "How much of the price today's cash profits explain."}
  - {type: calc, k: grow, label: "Growth as % of the share price", hint: "How much of the price is a bet on future growth."}
  - {type: test, k: rule, label: "Oakley's rule: EPV is at least 50% of the price", hint: "Don't buy if more than half the price relies on growth."}

  - {type: head, label: "4. Owner earnings and cash yield"}
  - {type: input, k: ni, label: "Normalized net income", kind: money, signed: true, hint: "Latest year, without one-off gains or losses. Needed for sections 4 and 5."}
  - {type: helper, id: epv-ni}
  - {type: input, k: onc, label: "Other non-cash items", kind: money, signed: true, hint: "Stock-based compensation, deferred tax, write-downs. D&A, maintenance capex and leases come from section 2."}
  - {type: total, k: oe, label: "Owner earnings", hint: "Net income + D&A + other non-cash − maintenance capex − lease payments"}
  - {type: total, k: oeps, label: "Owner earnings per share"}
  - {type: total, k: cy, label: "Cash yield", hint: "Owner earnings per share ÷ price. The interest rate the business pays you at today's price. Oakley wants at least 5%."}
  - {type: calc, k: p5, label: "Price for a 5% cash yield"}
  - {type: calc, k: p8, label: "Price for an 8% cash yield"}
  - {type: input, k: ty, label: "Your target cash yield (%)", kind: percent, default: 10}
  - {type: note, label: "Years of cash-profit growth needed to reach your target yield at today's price:"}
  - {type: calc, k: y5, label: "… growing 5% a year"}
  - {type: calc, k: y10, label: "… growing 10% a year"}
  - {type: calc, k: y15, label: "… growing 15% a year"}

  - {type: head, label: "5. Maximum price"}
  - {type: note, label: "Use the 10-year government bond yield and the inflation rate of the currency the company reports in (<span class=\"curname\">USD</span> on this page), not your own country's."}
  - {type: input, k: bond, label: "10-year government bond yield (%)", kind: percent, hint: "Optional. Only for Buffett's version below."}
  - {type: input, k: infl, label: "Inflation rate, latest year on year (%)", kind: percent, hint: "Needed for the maximum price."}
  - {type: input, k: spr, label: "Bond spread over inflation (%)", kind: percent, default: 3, hint: "Oakley's 3% is the 30-year average gap between UK 10-year gilts and UK inflation. Use the long-run gap for the company's currency if you know it."}
  - {type: calc, k: orate, label: "Oakley's rate", hint: "Inflation + spread"}
  - {type: total, k: maxp, label: "Maximum price", hint: "Owner earnings per share ÷ Oakley's rate"}
  - {type: calc, k: bmaxp, label: "Buffett's version", hint: "Owner earnings per share ÷ bond yield. Reference only: low bond yields give silly prices."}
  - {type: input, k: buf, label: "Safety buffer (%)", kind: percent, default: 15, hint: "Oakley's rule of thumb is 15%."}
  - {type: total, k: ideal, label: "Ideal buying price", hint: "Maximum price minus the buffer"}
  - {type: calc, k: cyi, label: "Cash yield at the ideal price"}
  - {type: calc, k: vsmax, label: "Share price vs maximum price"}
  - {type: test, k: sell, label: "Sell check", hint: "Oakley wouldn't sell at the maximum price, but might once the price is 25% above it."}

# Assets vs earnings power (Greenwald), row by row, in the order of Parts 0-3 of Greenwald_EPV_Template.xlsx.
# asset rows: k = book value; the page adds r<k> (reproduction cost) and l<k> (liquidation %, default liq).
greenwald_rows:
  - {type: head, label: "Market data"}
  - {type: input, k: sh, label: "Diluted shares outstanding", kind: shares, key: true, hint: "Basic shares plus in-the-money options and convertibles."}
  - {type: input, k: p, label: "Share price", kind: price, key: true, hint: "Per share, in full. Never in thousands."}
  - type: select
    k: via
    label: "Can a new competitor make money in this industry?"
    hint: "Greenwald's first question. If yes, an entrant would rebuild these assets, so value them at what that costs. If no, they're worth what a liquidator would get."
    options: [{v: "y", t: "Yes"}, {v: "n", t: "No"}]

  - {type: head, label: "1. Asset value", cols: ["Book", "Reproduction"]}
  - {type: note, label: "Book values from the balance sheet. With <em>Yes</em> above, type the cost to rebuild in the second column only where it differs from book (blank means book). With <em>No</em>, the second column is the share of book a liquidator would get, filled in with Greenwald's figures. Spare real estate and investments go in section 2."}
  - {type: asset, k: cash, label: "Cash and marketable securities", liq: 100}
  - {type: asset, k: ar, label: "Accounts receivable", liq: 85, hint: "To rebuild: add back the bad-debt allowance."}
  - {type: asset, k: inv, label: "Inventory", liq: 50, hint: "To rebuild: add back any LIFO reserve. A liquidator gets less than half for fashion or specialized stock."}
  - {type: asset, k: oca, label: "Other current assets", liq: 50, hint: "Prepaid expenses, deferred tax assets."}
  - {type: asset, k: ppe, label: "Property, plant and equipment", liq: 45, hint: "Land and buildings bought long ago usually cost more to rebuild than their book value. Equipment usually costs less."}
  - {type: asset, k: gw, label: "Goodwill", liq: 0, fixed: "Taken out", hint: "The two lines for intangibles below put a value on what it paid for."}
  - {type: asset, k: oi, label: "Other intangibles on the balance sheet", liq: 0, hint: "Software and licences bought recently can stay at book. Bought brands go in the brands line below."}
  - {type: asset, k: ooa, label: "Other operating assets", liq: 50}
  - {type: note, cls: intang, label: "What a new competitor would also have to build. Only with <em>Yes</em>: a liquidator gets nothing for these."}
  - {type: input, cls: intang, k: rd, label: "R&D per year", kind: money}
  - {type: input, cls: intang, k: ry, label: "Years of R&D to rebuild the products", kind: number, default: 3, hint: "Greenwald: about 3 for consumer products, 6 for cars."}
  - {type: calc, cls: intang, k: prod, label: "Product portfolio", hint: "R&D per year × years"}
  - {type: input, cls: intang, k: ib, label: "Base for customers, brands and organization", kind: money, hint: "SG&A, advertising or revenue. Pick one and set the multiple to match."}
  - {type: input, cls: intang, k: im, label: "Multiple of the base", kind: number, hint: "1 to 3 years of SG&A, or what a brand costs per $1 of sales."}
  - {type: calc, cls: intang, k: cust, label: "Customers, brands and organization", hint: "Base × multiple"}
  - {type: input, cls: intang, k: dp, label: "Deal price per $1 of sales", kind: number, hint: "Optional check. What buyers paid for similar businesses or brands, from acquisition notes."}
  - {type: calc, cls: intang, k: dpv, label: "Customers and brands at deal prices", hint: "Deal price × revenue from section 2. Compare it with the line above."}
  - {type: total, k: tot, label: "Total assets"}
  - {type: input, k: sl, label: "(−) Spontaneous liabilities", kind: money, hint: "Payables, accrued expenses and taxes payable: interest-free funding that comes with the business. Debt goes in section 2."}
  - {type: input, k: dtl, label: "(−) Deferred tax liabilities", kind: money, hint: "At book, or less if they won't be paid for many years."}
  - {type: total, k: av, label: "Asset value", hint: "Before debt."}

  - {type: head, label: "2. Earnings power value"}
  - {type: input, k: rev, label: "Revenue", kind: money, key: true, hint: "Latest year. If it's a peak or a trough, use the average of the cycle."}
  - {type: input, k: mg, label: "Average EBIT margin over the cycle (%)", kind: percent, key: true, signed: true, hint: "A simple average of 7 to 10 years. Only use a recent trend if there's a clear economic reason for it."}
  - {type: helper, id: gw-margin}
  - {type: calc, k: sebit, label: "Sustainable EBIT", hint: "Revenue × average margin"}
  - {type: input, k: roo, label: "(−) Recurring 'one-off' charges", kind: money, hint: "Yearly average. Charges that come back most years are a cost of doing business."}
  - {type: input, k: gsp, label: "(+) Growth spending above maintenance", kind: money, hint: "Optional. R&D, marketing or hiring clearly above what keeps today's business where it is."}
  - {type: input, k: oadj, label: "(±) Other adjustments", kind: money, signed: true, hint: "Earnings of affiliates outside EBIT, prices being corrected, and so on."}
  - {type: total, k: aebit, label: "Adjusted EBIT"}
  - {type: input, k: tax, label: "Average tax rate (%)", kind: percent, key: true, hint: "The average of the last few years."}
  - {type: calc, k: nopat, label: "After-tax operating earnings"}
  - {type: input, k: da, label: "Depreciation & amortization (D&A)", kind: money, key: true, hint: "Average of the last 2 or 3 years."}
  - {type: input, k: mcx, label: "Maintenance capex", kind: money, key: true, hint: "Total capex minus what growth needed. The helper below does it Greenwald's way."}
  - {type: helper, id: gw-capex}
  - {type: calc, k: xd, label: "Excess depreciation", hint: "D&A − maintenance capex"}
  - {type: input, k: xtax, label: "Tax rate on excess depreciation (%)", kind: percent, hint: "Blank = half the tax rate. The tax shield runs out one day, so Greenwald taxes it at about half the full rate."}
  - {type: calc, k: axd, label: "After-tax excess depreciation"}
  - {type: total, k: ep, label: "Earnings power", hint: "What the business could pay out every year and stay as it is."}
  - {type: note, label: "The rate. Greenwald skips CAPM and picks the cost of equity by how risky the business is."}
  - {type: input, k: ke, label: "Cost of equity (%)", kind: percent, default: 9, hint: "Low risk 7-8%, medium 9-10%, high 11-13%."}
  - {type: input, k: kd, label: "Pre-tax cost of debt (%)", kind: percent, hint: "Yield on the company's bonds, or on bonds with the same rating."}
  - {type: input, k: debt, label: "(−) Debt", kind: money, hint: "Bank loans and bonds."}
  - {type: calc, k: dw, label: "Debt weight", hint: "Debt ÷ (debt + market cap)"}
  - {type: input, k: cap, label: "Debt weight cap (%)", kind: percent, default: 30, hint: "Past about 30%, cheap debt hides the cost of distress, so Greenwald stops counting it."}
  - {type: calc, k: wacc, label: "Cost of capital"}
  - {type: total, k: R, label: "Rate used", hint: "Rounded to a whole point. Anything more precise is false precision."}
  - {type: total, k: epvE, label: "EPV of the business", hint: "Earnings power ÷ rate used, before debt and cash."}
  - {type: input, k: opc, label: "Cash the business needs (% of revenue)", kind: percent, default: 0.5, hint: "Greenwald: 0.25% to 0.5% of revenue. The rest of the cash in section 1 is surplus."}
  - {type: calc, k: surplus, label: "(+) Surplus cash"}
  - {type: input, k: noa, label: "(+) Non-operating assets", kind: money, hint: "Spare real estate, investments, affiliates outside EBIT. At market value."}
  - {type: input, k: leg, label: "(−) Legacy liabilities", kind: money, hint: "Pension deficit, retiree medical, lawsuits, environmental clean-up."}
  - {type: input, k: pref, label: "(−) Preferred equity", kind: money}
  - {type: input, k: mi, label: "(−) Minority interests", kind: money}
  - {type: total, k: epvEq, label: "EPV (equity)"}
  - {type: total, k: epvps, label: "EPV per share"}
  - {type: calc, k: mos, label: "Margin of safety", hint: "1 − price ÷ EPV per share. Greenwald wants a third to a half."}
  - {type: calc, k: emos, label: "Margin of safety on the whole business", hint: "1 − market enterprise value ÷ EPV of the business. Read this one when debt is high."}

  - {type: head, label: "3. Assets vs earnings power"}
  - {type: calc, k: avOp, label: "Asset value without surplus cash"}
  - {type: calc, k: ratio, label: "EPV ÷ asset value"}
  - {type: test, k: case, label: "Greenwald's case", hint: "A: below 0.75x. B: 0.75x to 1.25x. C: above 1.25x."}
  - {type: calc, k: franchise, label: "Franchise value", hint: "EPV of the business − asset value"}
  - {type: calc, k: roc, label: "Return on reproduction cost", hint: "Earnings power ÷ asset value. Above the rate used means excess returns, and only a moat keeps them there."}
  - {type: total, k: avEq, label: "Asset value (equity)", hint: "Asset value + non-operating assets − debt and other claims"}
  - {type: total, k: avps, label: "Asset value per share"}

# Penman's residual income, one-year version of Penman_Residual_Income_Template.xlsx (Parts 1, 3-6).
penman_rows:
  - {type: head, label: "Market data"}
  - {type: input, k: sh, label: "Diluted shares outstanding", kind: shares, key: true, hint: "Basic shares plus in-the-money options and convertibles."}
  - {type: input, k: p, label: "Share price", kind: price, key: true, hint: "Per share, in full. Never in thousands."}

  - {type: head, label: "1. Operations and financing"}
  - {type: note, label: "Split the latest balance sheet in two: what runs the business, and how it's financed. The helper below does it line by line."}
  - {type: input, k: noa, label: "Net operating assets (NOA)", kind: money, key: true, hint: "Operating assets − operating liabilities. Goodwill stays in. Cash usually goes in financing."}
  - {type: helper, id: pn-bs}
  - {type: input, k: nfo, label: "Net financial obligations", kind: money, key: true, signed: true, hint: "Debt, leases, preferred and pension deficit, minus cash and investments. Negative if the company has more cash than debt."}
  - {type: input, k: mi, label: "Minority interest", kind: money}
  - {type: input, k: eq, label: "Book value of common equity", kind: money, signed: true, hint: "Optional, for the check below."}
  - {type: test, k: chk, label: "Check: NOA − financial obligations − minority = equity", hint: "If it's off, a line is counted twice or missing."}
  - {type: calc, k: pnoa, label: "Market value of the operations", hint: "Market cap + net financial obligations + minority interest"}
  - {type: calc, k: ebp, label: "Enterprise book-to-price", hint: "NOA ÷ market value of the operations"}

  - {type: head, label: "2. Next year's operating income"}
  - {type: input, k: oi, label: "Core operating income after tax, next year", kind: money, key: true, signed: true, hint: "Operating income without one-time items, taxed at a normal rate, with no interest. Penman trusts a year ahead; go further only with a solid reason."}
  - {type: helper, id: pn-oi}
  - {type: input, k: r, label: "Your hurdle rate (%)", kind: percent, default: 9, hint: "The return you want to earn. Penman leaves it to you; he doesn't trust CAPM to set it."}
  - {type: calc, k: rnoa, label: "Return on net operating assets (RNOA)", hint: "Operating income ÷ NOA"}
  - {type: total, k: ri, label: "Residual operating income", hint: "Operating income − hurdle × NOA. What the business earns above your hurdle."}

  - {type: head, label: "3. The no-growth value"}
  - {type: total, k: val, label: "Value per share, no growth", hint: "(NOA + residual income ÷ hurdle − financial obligations − minority) ÷ shares"}
  - {type: calc, k: mos, label: "Margin of safety", hint: "1 − price ÷ value"}
  - {type: note, label: "What you pay for, per share and as % of the price:"}
  - {type: calc, k: b1, label: "1. Book value of the business"}
  - {type: calc, k: b2, label: "2. Value of next year's residual income"}
  - {type: total, k: b3, label: "3. Speculative growth", hint: "Price − 1 − 2. The part of the price that depends on growth."}

  - {type: head, label: "4. The growth the price implies"}
  - {type: input, k: gdp, label: "Long-run GDP growth (%)", kind: percent, default: 4, hint: "Nominal, for the company's currency. Penman uses 4% for the US, on the conservative side."}
  - {type: total, k: g, label: "Implied residual income growth", hint: "The growth that makes the value equal the price. It's also the growth you need to earn your hurdle."}
  - {type: calc, k: gvs, label: "Implied growth vs GDP growth", hint: "Above GDP needs a competitive advantage to back it."}
  - {type: calc, k: irnoa, label: "RNOA the price implies with no growth", hint: "Read this one when residual income is negative: the price assumes profitability recovers."}

  - {type: head, label: "5. Your return at today's price"}
  - {type: total, k: ngr, label: "Return if growth never comes", hint: "Operating income ÷ market value of the operations. Like the yield on a bond."}
  - {type: calc, k: rgdp, label: "Return at GDP growth"}
  - {type: input, k: bond, label: "Company's bond yield (%)", kind: percent, hint: "Optional. Or the yield on corporate bonds with similar risk."}
  - {type: calc, k: vsb, label: "No-growth return vs the bond yield", hint: "Below zero, the shares pay less than the bonds if growth doesn't come."}
  - {type: helper, id: pn-profile}

# Graham's formulas: The Intelligent Investor ch. 11 and 14, same order as Graham_Formulas_Template.xlsx.
graham_rows:
  - {type: head, label: "Market data"}
  - {type: input, k: p, label: "Share price", kind: price, key: true, hint: "Per share, in full."}

  - {type: head, label: "1. Graham's growth formula"}
  - {type: note, label: "Value = normal earnings × (8.5 + twice the expected growth rate). From chapter 11."}
  - {type: input, k: eps, label: "Normal earnings per share", kind: price, signed: true, hint: "Today's earnings without one-offs, or an average if this year was unusual."}
  - {type: helper, id: gr-eps}
  - {type: input, k: g, label: "Expected annual growth, next 7-10 years (%)", kind: percent, hint: "Graham: above about 8% there's no realistic way to value a company."}
  - {type: calc, k: mult, label: "Earnings multiplier", hint: "8.5 + 2 × growth. 8.5 is Graham's P/E for a business that doesn't grow."}
  - {type: total, k: val, label: "Value per share"}
  - {type: calc, k: mos, label: "Margin of safety", hint: "1 − price ÷ value"}
  - {type: total, k: ig, label: "Growth the price implies", hint: "(P/E − 8.5) ÷ 2. Graham ran the formula backwards like this himself."}
  - {type: note, label: "Graham's 1974 version, adjusted for bond yields. It isn't in the book: he added it after rates had soared."}
  - {type: input, k: y, label: "Yield on AAA corporate bonds (%)", kind: percent, hint: "Graham used 20-year AAA bonds; 4.4% was their yield in 1963. Use the highest-grade corporate yield in the company's currency."}
  - {type: total, k: valy, label: "Value per share × 4.4 ÷ bond yield"}
  - {type: calc, k: mosy, label: "Margin of safety"}
  - {type: calc, k: igy, label: "Growth the price implies, with the bond yield"}

  - {type: head, label: "2. The Graham number"}
  - {type: note, label: "Chapter 14 caps what a defensive investor should pay: P/E no more than 15 on three-year average earnings, price-to-book (P/B) no more than 1.5, or their product no more than 22.5. The Graham number is the price where that product hits 22.5."}
  - {type: input, k: e1, label: "EPS, latest year", kind: price, signed: true}
  - {type: input, k: e2, label: "EPS, one year earlier", kind: price, signed: true}
  - {type: input, k: e3, label: "EPS, two years earlier", kind: price, signed: true}
  - {type: calc, k: avg, label: "Average EPS, last 3 years"}
  - {type: input, k: bv, label: "Book value per share", kind: price, signed: true, hint: "Latest reported."}
  - {type: helper, id: gr-bv}
  - {type: calc, k: pe, label: "P/E on average earnings", hint: "Test 6: no more than 15."}
  - {type: calc, k: pb, label: "Price-to-book (P/B)", hint: "Test 7: no more than 1.5, or more if the P/E is low enough to keep the product at 22.5."}
  - {type: calc, k: pepb, label: "P/E × P/B", hint: "No more than 22.5."}
  - {type: total, k: gn, label: "Graham number", hint: "√(22.5 × average EPS × book value per share). A cap on what to pay; Graham never called it a value."}
  - {type: calc, k: vsgn, label: "Price vs the Graham number"}
  - {type: test, k: t67, label: "P/E × P/B test"}

  - {type: head, label: "3. Graham's other five tests"}
  - {type: note, label: "The rest of chapter 14's checklist for the defensive investor. Amounts in any unit, as long as it's the same one."}
  - {type: input, k: sales, label: "Annual sales", kind: number}
  - {type: input, k: minsales, label: "Your minimum sales", kind: number, hint: "Graham asked for $100 million in 1972 dollars. Jason Zweig's 2003 update: a market value above $2 billion."}
  - {type: test, k: t1, label: "1. Adequate size"}
  - {type: input, k: ca, label: "Current assets", kind: number}
  - {type: input, k: cl, label: "Current liabilities", kind: number}
  - {type: input, k: ltd, label: "Long-term debt", kind: number}
  - {type: calc, k: cr, label: "Current ratio"}
  - {type: test, k: t2, label: "2. Strong financial condition", hint: "Current ratio of at least 2, and long-term debt no bigger than working capital."}
  - {type: input, k: ypos, label: "Years with positive earnings, of the last 10", kind: number}
  - {type: test, k: t3, label: "3. Earnings stability", hint: "Earnings in each of the last 10 years."}
  - {type: input, k: ydiv, label: "Years of uninterrupted dividends", kind: number}
  - {type: test, k: t4, label: "4. Dividend record", hint: "At least 20 years."}
  - {type: input, k: e10, label: "Average EPS ten years ago (3-year average)", kind: price, signed: true, hint: "Average of the EPS 8, 9 and 10 years back. The ten-year helper in section 1 fills it in."}
  - {type: calc, k: eg, label: "Growth in 3-year average EPS over ten years"}
  - {type: test, k: t5, label: "5. Earnings growth", hint: "At least a third more over ten years."}
  - {type: total, k: n, label: "Tests passed, of 7", hint: "Tests 6 and 7 from section 2 count separately."}

# Free cash flow, recast (Mauboussin & Callahan, Categorizing for Clarity, 2021), same order as Mauboussin_FCF_Template.xlsx.
fcf_rows:
  - {type: head, label: "1. From the cash flow statement"}
  - {type: note, label: "Type outflows as positive numbers, and the section totals with their sign, as the statement shows them."}
  - {type: input, k: cfo, label: "Cash flow from operating activities", kind: money, key: true, signed: true}
  - {type: input, k: sbc, label: "Stock-based compensation", kind: money, hint: "The amount added back inside operating cash flow."}
  - {type: input, k: capex, label: "Purchases of property and equipment", kind: money, key: true}
  - {type: input, k: prc, label: "Proceeds from property and equipment sales", kind: money}
  - {type: input, k: acq, label: "Acquisitions, net of cash acquired", kind: money}
  - {type: input, k: cfi, label: "Cash flow from investing activities (total)", kind: money, signed: true, hint: "Negative when the company invests more than it receives."}
  - {type: input, k: lease, label: "Principal repayments of finance leases", kind: money, hint: "In financing activities. Add other financing obligations for leased assets, if any."}
  - {type: input, k: cff, label: "Cash flow from financing activities (total)", kind: money, signed: true}

  - {type: head, label: "2. Free cash flow, four ways"}
  - {type: total, k: fcf, label: "Popular free cash flow", hint: "Operating cash flow − net capex. Common, and the paper calls it misleading."}
  - {type: calc, k: fcfS, label: "After stock-based compensation", hint: "Stock pay is shares sold to pay employees: a real cost."}
  - {type: calc, k: fcfL, label: "After leases", hint: "Assets bought with a lease are investment too."}
  - {type: total, k: fcfSL, label: "After stock pay and leases"}
  - {type: calc, k: shrink, label: "How much smaller free cash flow gets"}
  - {type: calc, k: sbcCfo, label: "Stock pay as % of operating cash flow", hint: "Paper, Russell 1000 in 2020: median 5.7%, and 25% for tech."}
  - {type: calc, k: sbcFcf, label: "Stock pay as % of popular free cash flow"}

  - {type: head, label: "3. Intangible investment (optional)"}
  - type: select
    k: intg
    label: "Move intangible investment to investing?"
    hint: "The paper's biggest adjustment, and the one with the most judgment in it. It doesn't change free cash flow: it shows how much the company really invests."
    options: [{v: "n", t: "No"}, {v: "y", t: "Yes"}]
  - {type: input, cls: intang, k: ii, label: "Intangible investment this year", kind: money, hint: "The discretionary part of R&D, marketing and G&A. The helper below estimates it."}
  - {type: helper, id: fcf-intang}
  - {type: input, cls: intang, k: ia, label: "Amortization of past intangible investment", kind: money}
  - {type: input, cls: intang, k: ni, label: "Net income", kind: money, signed: true, hint: "Optional, for the line below."}
  - {type: calc, cls: intang, k: niA, label: "Net income, adjusted", hint: "+ intangible investment − its amortization"}

  - {type: head, label: "4. The statement, recast"}
  - type: select
    k: ms
    label: "Treat marketable securities as cash?"
    hint: "Optional, and the paper calls it more open to debate. It makes sense for cash-rich companies with short-term securities they don't need to operate."
    options: [{v: "n", t: "No"}, {v: "y", t: "Yes"}]
  - {type: input, k: msp, label: "Purchases of marketable securities", kind: money}
  - {type: input, k: mss, label: "Sales and maturities of marketable securities", kind: money}
  - {type: helper, id: fcf-table}

  - {type: head, label: "5. How much the company really invests"}
  - {type: total, k: inv, label: "Total investment", hint: "Net capex + leased assets + acquisitions + intangible investment (if you moved it)"}
  - {type: calc, k: invRep, label: "What the statement shows", hint: "Net capex + acquisitions"}
  - {type: total, k: invX, label: "Real investment ÷ what the statement shows"}
  - {type: calc, k: invCfo, label: "Investment as % of adjusted operating cash flow", hint: "Above 100%, the company had to raise money or spend cash to fund it."}

  - {type: head, label: "6. The multiples (optional)"}
  - {type: input, k: ev, label: "Enterprise value", kind: money}
  - {type: input, k: ebitda, label: "EBITDA, reported", kind: money}
  - {type: calc, k: evR, label: "EV/EBITDA, reported"}
  - {type: total, k: evA, label: "EV/EBITDA, with intangible investment", hint: "EBITDA rises by the full intangible investment. For Amazon in 2020 the paper gets 18x instead of 35x."}
  - {type: input, k: sh, label: "Diluted shares", kind: shares}
  - {type: input, k: p, label: "Share price", kind: price}
  - {type: calc, k: yR, label: "Popular free cash flow yield"}
  - {type: total, k: yA, label: "Yield after stock pay and leases"}

# ROIC, ROIIC and reinvestment, same formulas as ROIC_Reinvestment_Template.xlsx.
roic_rows:
  - {type: head, label: "1. Settings"}
  - {type: input, k: tax, label: "Tax rate on operating income (%)", kind: percent, key: true, hint: "A normal rate, the same for every year. Damodaran's EBIT(1 − t)."}
  - {type: input, k: opc, label: "Operating cash (% of revenue)", kind: percent, default: 2, hint: "Cash above this is excess and comes out of invested capital. Mauboussin and Callahan: about 2%, up to 5% for faster-growing or less predictable companies."}
  - {type: input, k: coc, label: "Cost of capital (%)", kind: percent, hint: "Optional, for the ROIC spread."}
  - {type: input, k: year, label: "Latest fiscal year", kind: number, hint: "Optional, only for the column labels."}

  - {type: head, label: "2. Seven years of numbers"}
  - {type: note, label: "Oldest on the left. Year 0 only needs revenue and the balance sheet. Tip: copy a row of numbers from a spreadsheet and paste it in the first box of a line; it fills the years across."}
  - {type: helper, id: roic-grid}

  - {type: head, label: "3. Year by year"}
  - {type: helper, id: roic-results}

  - {type: head, label: "4. Summary"}
  - {type: total, k: roicL, label: "ROIC, latest year", hint: "NOPAT ÷ invested capital at the start of the year"}
  - {type: calc, k: roicxL, label: "ROIC without goodwill, latest year", hint: "The business on its own. With goodwill, it's what shareholders earn after paying for the acquisitions."}
  - {type: calc, k: spread, label: "ROIC minus cost of capital"}
  - {type: calc, k: avgRoic, label: "Average ROIC, last 5 years"}
  - {type: total, k: roiic3, label: "ROIIC, 3 years", hint: "Change in NOPAT ÷ the capital added a year earlier"}
  - {type: total, k: roiic5, label: "ROIIC, 5 years"}
  - {type: calc, k: rrL, label: "Reinvestment rate, latest year", hint: "(Capex + acquisitions − D&A + Δ working capital) ÷ NOPAT"}
  - {type: total, k: rr5, label: "Reinvestment rate, last 5 years combined"}
  - {type: calc, k: fgL, label: "Fundamental growth, latest year", hint: "Reinvestment rate × ROIC"}
  - {type: total, k: fg5, label: "Fundamental growth, 5-year reinvestment × average ROIC"}
  - {type: total, k: cagr, label: "Actual NOPAT growth, 5 years a year"}
  - {type: calc, k: gap, label: "Fundamental minus actual growth", hint: "Above zero: the reinvestment hasn't shown up in profit yet, or earned less than the average. Below zero: growth came from better returns on old capital, which doesn't last forever."}
  - {type: calc, k: bsVsCf, label: "Capital added ÷ reinvestment, 5 years", hint: "Close to 1.00x when the balance sheet and the cash flow statement agree."}

# Reverse DCF: Mauboussin & Rappaport, Expectations Investing (2021), retail version. Same order as Reverse_DCF_Template.xlsx.
reverse_dcf_rows:
  - {type: head, label: "Market data"}
  - {type: input, k: sh, label: "Diluted shares outstanding", kind: shares, key: true}
  - {type: input, k: p, label: "Share price", kind: price, key: true, hint: "Per share, in full."}

  - {type: head, label: "1. The company"}
  - {type: input, k: s0, label: "Sales, last full year", kind: money, key: true}
  - {type: input, k: debt, label: "Debt", kind: money, hint: "Bank loans and bonds. Add leases, preferred stock and pension deficits if they're large."}
  - {type: input, k: cash, label: "Cash and investments", kind: money, hint: "Cash, securities and stakes in other companies the business doesn't need to operate."}

  - {type: head, label: "2. What you believe"}
  - {type: note, label: "Your view of the years ahead. To start from the company's last 3 years, use the helper below: it fills in the four fields for you."}
  - {type: helper, id: rd-history}
  - {type: input, k: g, label: "Sales growth, a year (%)", kind: percent, key: true, signed: true}
  - {type: input, k: m, label: "Operating margin (%)", kind: percent, key: true, signed: true, hint: "Operating profit ÷ sales."}
  - {type: input, k: t, label: "Cash tax rate (%)", kind: percent, default: 21, hint: "Taxes paid in cash on operating profit. 21% is the US federal rate."}
  - {type: input, k: inv, label: "Reinvestment per $1 of new sales (%)", kind: percent, key: true, hint: "Capex above depreciation, plus extra working capital, for each new dollar of sales. 25 means 25 cents."}
  - {type: input, k: r, label: "Discount rate (%)", kind: percent, default: 9, hint: "Set it by risk: large, steady companies 7-9%. Smaller or indebted ones 10-12%. Very small and risky, 15% or more."}
  - {type: helper, id: rd-wacc}
  - {type: input, k: cg, label: "Cash flow growth after the forecast (%)", kind: percent, default: 2, signed: true, hint: "Inflation (2%) if the company keeps its pricing power, half of it if it keeps some, 0 if none, below zero for a business in decline."}

  - {type: head, label: "3. What the price implies"}
  - {type: calc, k: mcap, label: "Market value of the shares"}
  - {type: calc, k: ev, label: "Enterprise value", hint: "Market value + debt − cash and investments"}
  - {type: calc, k: v0, label: "Value per share with no advantage", hint: "Today's profit growing only at the post-forecast rate, plus cash, minus debt."}
  - {type: total, k: yrs, label: "Years of advantage the price implies", hint: "Years of cash flows it takes to reach the price. The book calls it the market-implied forecast period: 5 to 15 years for most US stocks, up to 30 for strong competitive positions."}
  - {type: calc, k: vyr, label: "Value per share at the nearest full year"}
  - {type: calc, k: tm, label: "Threshold margin", hint: "The operating margin a year of growth needs just to keep the value where it is."}
  - {type: test, k: grow, label: "Does growth add value?", hint: "Yes when your margin is above the threshold."}

  - {type: head, label: "4. The growth the price implies"}
  - {type: input, k: n, label: "Years you expect the advantage to last", kind: years, default: 10}
  - {type: total, k: ig, label: "Sales growth the price implies, a year"}
  - {type: calc, k: igb, label: "Versus your sales growth"}
  - {type: calc, k: igh, label: "Versus the last 3 years", hint: "Needs the last-3-years helper in section 2."}
  - {type: helper, id: rd-table}

# What to pay for quality: The Compounders, chapter 13. Same order as Pay_For_Quality_Template.xlsx.
compounders_rows:
  - {type: head, label: "1. The business"}
  - {type: input, k: r, label: "Cost of capital (%)", kind: percent, default: "9.5", hint: "The book uses 9.5%. It's also the return of a business with no edge, the baseline for 'the market'."}
  - {type: input, k: ro, label: "Return on new capital (%)", kind: percent, key: true, hint: "What the company earns on the capital it adds (ROIIC), not on what it already has. The book's columns: 9.5% to 22%."}
  - {type: input, k: g, label: "Growth, a year (%)", kind: percent, key: true, signed: true, hint: "Of earnings."}
  - {type: input, k: n, label: "Years the growth lasts", kind: years, hint: "Blank = forever, as in the book. With a number, the business keeps growing after that but only earns its cost of capital, so growth adds nothing more."}

  - {type: head, label: "2. What it's worth"}
  - {type: calc, k: vng, label: "No-growth business: value of $1 of next year's earnings", hint: "1 ÷ cost of capital"}
  - {type: calc, k: v, label: "This business: value of $1 of next year's earnings", hint: "(1 − growth ÷ return on new capital) ÷ (cost of capital − growth), when growth lasts forever"}
  - {type: calc, k: mult, label: "Value multiple vs no growth"}
  - {type: total, k: prem, label: "Premium you can pay", hint: "Over the market multiple, if the market is a business with no edge."}
  - {type: calc, k: fg, label: "Share of the value that comes from growth"}
  - {type: calc, k: reinv, label: "Share of earnings it has to reinvest", hint: "Growth ÷ return on new capital"}

  - {type: head, label: "3. Against the market"}
  - {type: input, k: mpe, label: "Market P/E", kind: pe, hint: "Optional. The P/E of a business with no edge; the index P/E is a rough stand-in."}
  - {type: input, k: cpe, label: "Company's P/E", kind: pe, hint: "Optional."}
  - {type: total, k: jpe, label: "P/E the premium justifies"}
  - {type: calc, k: paying, label: "Premium you're paying", hint: "Company's P/E ÷ market P/E − 1"}
  - {type: calc, k: room, label: "Justified P/E vs the company's P/E", hint: "Above zero: the price is below what the premium justifies."}
  - {type: helper, id: cp-matrix}

  - {type: head, label: "4. Fair P/E for your target return"}
  - {type: note, label: "Figure 13.2 of the book: the P/E you can pay today and still earn your target, for a business that reinvests part of its earnings at a given ROE."}
  - {type: input, k: rr, label: "Share of earnings reinvested (%)", kind: percent, hint: "The book shows 60%, 70% and 80%. The rest is paid out to you."}
  - {type: input, k: roe, label: "Return on equity (%)", kind: percent, hint: "On the earnings it keeps. The book's range: 10% to 30%."}
  - {type: input, k: k, label: "Your target return (%)", kind: percent, default: 8, hint: "The book uses 8% a year."}
  - {type: input, k: hy, label: "Years you hold", kind: years, default: 20, hint: "The book uses 20."}
  - {type: input, k: xpe, label: "P/E you sell at", kind: pe, hint: "Blank = 1 ÷ your target return (12.5x at 8%): the business valued with no growth when you sell. The book doesn't say what it used."}
  - {type: calc, k: fgr, label: "Earnings growth, a year", hint: "Reinvestment × ROE"}
  - {type: calc, k: fx, label: "P/E you sell at, used"}
  - {type: calc, k: fdiv, label: "Dividends, per $1 of today's earnings", hint: "Present value at your target return"}
  - {type: calc, k: fsale, label: "Sale, per $1 of today's earnings", hint: "Present value at your target return"}
  - {type: total, k: fpe, label: "Fair P/E today"}
  - {type: calc, k: fen, label: "Earnings when you sell, per $1 today"}
  - {type: input, k: fpe2, label: "Company's P/E", kind: pe, hint: "Optional, to compare."}
  - {type: calc, k: fvs, label: "Fair P/E vs the company's P/E", hint: "Above zero: at today's P/E you'd earn more than your target, if the reinvestment and ROE hold."}
  - {type: helper, id: cp-grid}

# Pabrai's Dhandho bet: The Dhandho Investor, chapter 10. Same order as Dhandho_Bet_Template.xlsx.
dhandho_rows:
  - {type: head, label: "1. Your bet"}
  - {type: input, k: price, label: "Price you pay per share", kind: number, hint: "Optional. Fill it in to type each outcome as a value per share instead of a return."}
  - {type: input, k: yrs, label: "Years until it plays out", kind: years, default: 3, hint: "Pabrai assumes the gap to value closes in 3 years or less."}
  - {type: helper, id: dh-outcomes}

  - {type: head, label: "2. The odds"}
  - {type: total, k: edge, label: "Expected return (the edge)", hint: "Probability × return, added up."}
  - {type: calc, k: mult, label: "Expected multiple of your money"}
  - {type: calc, k: year, label: "Expected return a year"}
  - {type: calc, k: lose, label: "Chance of losing money", hint: "Pabrai's test: heads I win, tails I don't lose much."}
  - {type: calc, k: wipe, label: "Chance of losing it all"}
  - {type: calc, k: best, label: "Best outcome"}
  - {type: calc, k: worst, label: "Worst outcome"}

  - {type: head, label: "3. How much to bet"}
  - {type: calc, k: short, label: "Pabrai's shortcut: edge ÷ odds", hint: "Odds = what you win if you win (the best outcome). Exact with two outcomes."}
  - {type: total, k: kelly, label: "Kelly for several outcomes", hint: "The share of your bankroll that makes it grow fastest over many bets. Pabrai's cases use this one."}
  - {type: calc, k: half, label: "Half Kelly", hint: "Less volatile, and it forgives a mistake in the odds."}
  - {type: input, k: cap, label: "Most you'll put in one position (%)", kind: percent, default: 10, hint: "Pabrai Funds puts about 10% in each bet."}
  - {type: total, k: pos, label: "Position size", hint: "The smaller of Kelly and your limit."}

  - {type: head, label: "4. Several bets at once"}
  - {type: note, label: "Kelly sizes each bet as if it were the only one. With several at the same time and no borrowing, scale them down so they add up to 100% (tables 10.2 and 10.3 of the book). Type the Kelly percentage of each bet."}
  - {type: helper, id: dh-portfolio}

# Peter Lynch's P/E vs growth: One Up on Wall Street, chapter 13. Same order as Lynch_PE_Growth_Template.xlsx.
lynch_rows:
  - {type: head, label: "1. The company"}
  - {type: input, k: price, label: "Share price", kind: number, key: true}
  - {type: input, k: eps, label: "Earnings per share, last 12 months", kind: number, key: true}
  - {type: input, k: g, label: "Long-term growth of earnings, a year (%)", kind: percent, key: true, signed: true, hint: "Your estimate of future growth. 'Your guess is as good as mine,' Lynch says. The helper below gives the past growth."}
  - {type: calc, k: hg, label: "Growth over the last years", hint: "From the helper"}
  - {type: helper, id: ly-growth}
  - {type: input, k: dps, label: "Dividend per share, a year", kind: number, hint: "Optional."}
  - {type: input, k: cash, label: "Net cash per share", kind: number, signed: true, hint: "Optional. Cash and investments minus long-term debt, per share. Negative if debt is larger. Lynch's Ford example."}

  - {type: head, label: "2. Lynch's numbers"}
  - {type: calc, k: pe, label: "P/E"}
  - {type: calc, k: yld, label: "Dividend yield"}
  - {type: total, k: peg, label: "PEG: P/E ÷ growth rate", hint: "1 = fairly priced. Half is very positive; twice is very negative."}
  - {type: test, k: pegr, label: "Reading"}
  - {type: total, k: div, label: "With dividends: (growth + yield) ÷ P/E", hint: "Less than 1 is poor, 1.5 is okay, 2 or better is what you're looking for."}
  - {type: test, k: divr, label: "Reading"}
  - {type: calc, k: pex, label: "P/E without the net cash", hint: "(Price − net cash) ÷ EPS: what you pay for the business itself."}
  - {type: calc, k: pegx, label: "PEG without the net cash"}
  - {type: calc, k: divx, label: "With dividends, without the net cash"}
  - {type: total, k: fair, label: "Price where the P/E equals the growth rate", hint: "Growth rate × EPS: Lynch's fair price."}
  - {type: calc, k: fairc, label: "Plus the net cash"}
  - {type: calc, k: up, label: "Upside to the fair price", hint: "Uses the fair price plus net cash when you gave it."}

  - {type: head, label: "3. The arithmetic of compounded earnings"}
  - {type: input, k: yrs, label: "Years", kind: years, default: 10, hint: "Lynch's example runs 10 years."}
  - {type: input, k: peEnd, label: "P/E at the end", kind: pe, hint: "Blank = today's P/E. Lynch: even if a 20% grower's P/E falls from 20 to 15, it beats a 10% grower at 10 times earnings."}
  - {type: calc, k: epsn, label: "Earnings per share at the end"}
  - {type: calc, k: peu, label: "P/E used"}
  - {type: total, k: pricen, label: "Share price at the end"}
  - {type: calc, k: multn, label: "Multiple of today's price"}
  - {type: calc, k: yearn, label: "Return a year, before dividends"}
