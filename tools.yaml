# Google Analytics measurement ID for tools.ezrasnotes.com. Empty turns Analytics off.
ga_id: "G-FTNNLB6W9D"

# Every tool on the site. The home page list is built from this file.
# status: live (has a page) or soon (shows as "Coming soon").
# To add a tool, see COMO-AGREGAR-UNA-HERRAMIENTA.md.

tools:
  - slug: net-net
    name: Net-net calculator
    nav: Net-net
    status: live
    blurb: Graham's NCAV, modern NCAV, net cash, Schloss' working capital and book value, per share and against the price.

  - slug: epv
    name: Earnings power value
    nav: EPV
    status: live
    blurb: What the business is worth if today's cash profits never grow, how much of the price is a bet on growth, and the most you should pay.

  - slug: greenwald
    name: Greenwald's moat test
    nav: Greenwald
    status: live
    blurb: Greenwald's test. What it would cost to rebuild the business, what its earnings are worth with no growth, and what the gap says about its moat.

  - slug: penman
    name: Penman's residual income
    nav: Penman
    status: live
    blurb: Anchor on the book value of the operations, then see the growth the price implies and the return you earn at today's price.

  - slug: reverse-dcf
    name: Reverse DCF
    status: soon
    blurb: The growth the current price already assumes.

  - slug: red-flags
    name: Red flags
    status: soon
    blurb: Accounting warning signs to check before you buy.

  - slug: moat-management
    name: Moat and management scorecard
    status: soon
    blurb: A scorecard for the competitive advantage and the people running it.

# The net-net calculator, row by row, in the same order as Ezra's Excel template.
# type: head (section title), input, calc (calculated line), result (total + per share),
#       ratio (price / per share), test (passes or fails).
# k is the short name used in shared links. kind: money, shares, price, percent, number.
net_net_rows:
  - {type: head, label: "Balance sheet"}
  - {type: input, k: c,  label: "Cash & Equivalents", kind: money}
  - {type: input, k: s,  label: "Short-term Investments", kind: money}
  - {type: input, k: r,  label: "Restricted Cash", kind: money, hint: "Counts, even if it isn't available for daily operations."}
  - {type: calc,  k: totalCash, label: "Total Cash", hint: "Cash & Equivalents + Short-term Investments + Restricted Cash"}
  - {type: input, k: ar, label: "Total Receivables", kind: money, hint: "Accounts + other + notes receivable."}
  - {type: input, k: in, label: "Inventory", kind: money}
  - {type: input, k: pp, label: "Prepaid Expenses", kind: money}
  - {type: input, k: ca, label: "Total Current Assets", kind: money, key: true}
  - {type: calc,  k: otherCA, label: "Other Current Assets", hint: "Total Current Assets minus the lines above."}
  - {type: input, k: a,  label: "Total Assets", kind: money, hint: "Only used for book value."}
  - {type: input, k: g,  label: "Goodwill", kind: money, hint: "Only used for adjusted book value."}
  - {type: input, k: ia, label: "Intangible Assets", kind: money, hint: "Only used for adjusted book value."}
  - {type: input, k: rou, label: "Right-of-use Assets", kind: money, hint: "Operating lease assets. Only used for adjusted book value."}
  - {type: input, k: cl, label: "Total Current Liabilities", kind: money}
  - {type: input, k: d,  label: "Long-Term Debt", kind: money}
  - {type: input, k: l,  label: "Total Liabilities", kind: money, key: true}
  - {type: input, k: ob, label: "Off-Balance Sheet Liabilities", kind: money, hint: "Unfunded pensions, guarantees, litigation. Read the notes."}
  - {type: input, k: pf, label: "Preferred Stock", kind: money, hint: "Face value."}
  - {type: head, label: "Market"}
  - {type: input, k: sh, label: "Shares Outstanding", kind: shares, key: true}
  - {type: input, k: p,  label: "Current Stock Price", kind: price, key: true, hint: "Per share, in full. Never in thousands."}
  - {type: input, k: mc, label: "Market Cap", kind: money, hint: "Leave blank to use shares × price."}
  - {type: input, k: ev, label: "EV", kind: money, hint: "Leave blank for market cap + debt + preferred − total cash."}
  - {type: head, label: "Results", columns: true}
  - {type: result, k: ncav, label: "Ben Graham's NCAV", hint: "Current Assets − Total Liabilities"}
  - {type: ratio,  k: ncav, label: "P/NCAV"}
  - {type: result, k: adj, label: "Modern NCAV", hint: "Current Assets − (Total Liabilities + Off-Balance Sheet Liabilities + Preferred Stock)"}
  - {type: ratio,  k: adj, label: "Modern P/NCAV"}
  - {type: result, k: netCash, label: "Net Cash", hint: "Total Cash − Total Liabilities"}
  - {type: ratio,  k: netCash, label: "P/Net Cash"}
  - {type: result, k: wc, label: "Working Capital", hint: "Current Assets − Current Liabilities"}
  - {type: result, k: schloss, label: "Walter Schloss' WC", hint: "Current Assets − Current Liabilities − Long-Term Debt"}
  - {type: result, k: bv, label: "Book Value", hint: "Total Assets − Total Liabilities"}
  - {type: ratio,  k: bv, label: "P/B"}
  - {type: result, k: abv, label: "Adjusted Book Value", hint: "(Total Assets − Goodwill − Intangible Assets − Right-of-use Assets) − Total Liabilities"}
  - {type: ratio,  k: abv, label: "Adjusted P/B"}
  - {type: head, label: "Net net working capital", columns: true}
  - {type: input, k: ar_h, label: "Receivables taken at (%)", kind: percent, default: 75}
  - {type: input, k: in_h, label: "Inventory taken at (%)", kind: percent, default: 50}
  - {type: result, k: nnwc, label: "Net Net Working Capital", hint: "Total Cash + Receivables × haircut + Inventory × haircut − Total Liabilities"}
  - {type: ratio,  k: nnwc, label: "P/NNWC"}
  - {type: head, label: "Your test"}
  - {type: input, k: max, label: "Your max P/NCAV", kind: number, default: 0.66, hint: "Graham bought at 0.66 or less. Many investors today accept anything under 1."}
  - {type: test, k: graham, label: "Graham NCAV test"}
  - {type: test, k: modern, label: "Modern NCAV test"}

# The EPV calculator (Phil Oakley's method), row by row, in the same order as Oakley_EPV_Template.xlsx.
# signed: true lets a field take negative numbers.
epv_rows:
  - {type: head, label: "Market data"}
  - {type: input, k: sh, label: "Shares outstanding (latest)", kind: shares, key: true, hint: "Used for EPV per share."}
  - {type: input, k: wsh, label: "Weighted average diluted shares", kind: shares, hint: "Optional. Used for owner earnings per share. Blank = shares outstanding."}
  - {type: input, k: p, label: "Share price", kind: price, key: true, hint: "Per share, in full. Never in thousands."}

  - {type: head, label: "1. Normalized EBIT"}
  - {type: input, k: ebit, label: "Average EBIT (5 years) or latest underlying EBIT", kind: money, key: true, signed: true, hint: "A 5-year average smooths out one good or bad year."}
  - {type: helper, id: epv-ebit}
  - {type: note, label: "One-offs, averaged over the same years. Costs as positive (they get added back), gains as negative."}
  - {type: input, k: rs, label: "Restructuring costs", kind: money, signed: true}
  - {type: input, k: imp, label: "Impairments and write-downs", kind: money, signed: true}
  - {type: input, k: iw, label: "Inventory write-offs", kind: money, signed: true}
  - {type: input, k: tc, label: "Transaction costs", kind: money, signed: true}
  - {type: input, k: ls, label: "Legal settlements (net)", kind: money, signed: true, hint: "A net gain goes in as negative."}
  - {type: input, k: gs, label: "Gains (−) / losses (+) on asset sales", kind: money, signed: true}
  - {type: input, k: oo, label: "Other one-offs", kind: money, signed: true, hint: "If a one-off shows up most years, it isn't one. Leave it in EBIT."}
  - {type: total, k: nebit, label: "Normalized EBIT", hint: "Average EBIT + one-offs"}

  - {type: head, label: "2. Cash profits"}
  - {type: input, k: da, label: "Depreciation & amortization (D&A)", kind: money, key: true, hint: "Latest year, from the cash flow statement."}
  - {type: input, k: mcx, label: "Maintenance capex", kind: money, key: true, hint: "What it costs to keep the business as it is. If the company doesn't say, Oakley uses the higher of the 5- and 10-year average capex. 120% of D&A is a rougher shortcut."}
  - {type: helper, id: epv-capex}
  - {type: input, k: lease, label: "Lease payments", kind: money, hint: "Optional, for IFRS 16 reporters: their D&A includes the depreciation of leased assets, so take off the rent actually paid. If you fill this, leave lease liabilities out of debt."}
  - {type: calc, k: pre, label: "Pre-tax cash profits", hint: "Normalized EBIT + D&A − maintenance capex − lease payments"}
  - {type: input, k: tax, label: "Tax rate (%)", kind: percent, default: 25, hint: "If the effective rate is below the statutory rate, Oakley uses the statutory one."}
  - {type: total, k: cp, label: "After-tax cash profits", hint: "This is the company's earnings power."}

  - {type: head, label: "3. Earnings power value"}
  - {type: input, k: r, label: "Required rate of return (%)", kind: percent, default: 9, hint: "Oakley's guide: large, steady companies 7-9%. Smaller or indebted ones 10-12%. Very small and risky, 15% or more."}
  - {type: calc, k: ev, label: "Enterprise value", hint: "After-tax cash profits ÷ required rate"}
  - {type: input, k: debt, label: "(−) Debt", kind: money}
  - {type: input, k: pen, label: "(−) Pension deficit", kind: money}
  - {type: input, k: pref, label: "(−) Preferred equity", kind: money}
  - {type: input, k: mi, label: "(−) Minority interests", kind: money}
  - {type: input, k: cash, label: "(+) Surplus cash", kind: money, hint: "Cash the business doesn't need to operate."}
  - {type: total, k: epv, label: "EPV (equity)"}
  - {type: total, k: epvps, label: "EPV per share"}
  - {type: calc, k: epvpct, label: "EPV as % of the share price", hint: "How much of the price today's cash profits explain."}
  - {type: calc, k: grow, label: "Growth as % of the share price", hint: "How much of the price is a bet on future growth."}
  - {type: test, k: rule, label: "Oakley's rule: EPV is at least 50% of the price", hint: "Don't buy if more than half the price relies on growth."}

  - {type: head, label: "4. Owner earnings and cash yield"}
  - {type: input, k: ni, label: "Normalized net income", kind: money, signed: true, hint: "Latest year, without one-off gains or losses. Needed for sections 4 and 5."}
  - {type: helper, id: epv-ni}
  - {type: input, k: onc, label: "Other non-cash items", kind: money, signed: true, hint: "Stock-based compensation, deferred tax, write-downs. D&A, maintenance capex and leases come from section 2."}
  - {type: total, k: oe, label: "Owner earnings", hint: "Net income + D&A + other non-cash − maintenance capex − lease payments"}
  - {type: total, k: oeps, label: "Owner earnings per share"}
  - {type: total, k: cy, label: "Cash yield", hint: "Owner earnings per share ÷ price. The interest rate the business pays you at today's price. Oakley wants at least 5%."}
  - {type: calc, k: p5, label: "Price for a 5% cash yield"}
  - {type: calc, k: p8, label: "Price for an 8% cash yield"}
  - {type: input, k: ty, label: "Your target cash yield (%)", kind: percent, default: 10}
  - {type: note, label: "Years of cash-profit growth needed to reach your target yield at today's price:"}
  - {type: calc, k: y5, label: "… growing 5% a year"}
  - {type: calc, k: y10, label: "… growing 10% a year"}
  - {type: calc, k: y15, label: "… growing 15% a year"}

  - {type: head, label: "5. Maximum price"}
  - {type: note, label: "Use the 10-year government bond yield and the inflation rate of the currency the company reports in (<span class=\"curname\">USD</span> on this page), not your own country's."}
  - {type: input, k: bond, label: "10-year government bond yield (%)", kind: percent, hint: "Optional. Only for Buffett's version below."}
  - {type: input, k: infl, label: "Inflation rate, latest year on year (%)", kind: percent, hint: "Needed for the maximum price."}
  - {type: input, k: spr, label: "Bond spread over inflation (%)", kind: percent, default: 3, hint: "Oakley's 3% is the 30-year average gap between UK 10-year gilts and UK inflation. Use the long-run gap for the company's currency if you know it."}
  - {type: calc, k: orate, label: "Oakley's rate", hint: "Inflation + spread"}
  - {type: total, k: maxp, label: "Maximum price", hint: "Owner earnings per share ÷ Oakley's rate"}
  - {type: calc, k: bmaxp, label: "Buffett's version", hint: "Owner earnings per share ÷ bond yield. Reference only: low bond yields give silly prices."}
  - {type: input, k: buf, label: "Safety buffer (%)", kind: percent, default: 15, hint: "Oakley's rule of thumb is 15%."}
  - {type: total, k: ideal, label: "Ideal buying price", hint: "Maximum price minus the buffer"}
  - {type: calc, k: cyi, label: "Cash yield at the ideal price"}
  - {type: calc, k: vsmax, label: "Share price vs maximum price"}
  - {type: test, k: sell, label: "Sell check", hint: "Oakley wouldn't sell at the maximum price, but might once the price is 25% above it."}

# Assets vs earnings power (Greenwald), row by row, in the order of Parts 0-3 of Greenwald_EPV_Template.xlsx.
# asset rows: k = book value; the page adds r<k> (reproduction cost) and l<k> (liquidation %, default liq).
greenwald_rows:
  - {type: head, label: "Market data"}
  - {type: input, k: sh, label: "Diluted shares outstanding", kind: shares, key: true, hint: "Basic shares plus in-the-money options and convertibles."}
  - {type: input, k: p, label: "Share price", kind: price, key: true, hint: "Per share, in full. Never in thousands."}
  - type: select
    k: via
    label: "Can a new competitor make money in this industry?"
    hint: "Greenwald's first question. If yes, an entrant would rebuild these assets, so value them at what that costs. If no, they're worth what a liquidator would get."
    options: [{v: "y", t: "Yes"}, {v: "n", t: "No"}]

  - {type: head, label: "1. Asset value", cols: ["Book", "Reproduction"]}
  - {type: note, label: "Book values from the balance sheet. With <em>Yes</em> above, type the cost to rebuild in the second column only where it differs from book (blank means book). With <em>No</em>, the second column is the share of book a liquidator would get, filled in with Greenwald's figures. Spare real estate and investments go in section 2."}
  - {type: asset, k: cash, label: "Cash and marketable securities", liq: 100}
  - {type: asset, k: ar, label: "Accounts receivable", liq: 85, hint: "To rebuild: add back the bad-debt allowance."}
  - {type: asset, k: inv, label: "Inventory", liq: 50, hint: "To rebuild: add back any LIFO reserve. A liquidator gets less than half for fashion or specialized stock."}
  - {type: asset, k: oca, label: "Other current assets", liq: 50, hint: "Prepaid expenses, deferred tax assets."}
  - {type: asset, k: ppe, label: "Property, plant and equipment", liq: 45, hint: "Land and buildings bought long ago usually cost more to rebuild than their book value. Equipment usually costs less."}
  - {type: asset, k: gw, label: "Goodwill", liq: 0, fixed: "Taken out", hint: "The two lines for intangibles below put a value on what it paid for."}
  - {type: asset, k: oi, label: "Other intangibles on the balance sheet", liq: 0, hint: "Software and licences bought recently can stay at book. Bought brands go in the brands line below."}
  - {type: asset, k: ooa, label: "Other operating assets", liq: 50}
  - {type: note, cls: intang, label: "What a new competitor would also have to build. Only with <em>Yes</em>: a liquidator gets nothing for these."}
  - {type: input, cls: intang, k: rd, label: "R&D per year", kind: money}
  - {type: input, cls: intang, k: ry, label: "Years of R&D to rebuild the products", kind: number, default: 3, hint: "Greenwald: about 3 for consumer products, 6 for cars."}
  - {type: calc, cls: intang, k: prod, label: "Product portfolio", hint: "R&D per year × years"}
  - {type: input, cls: intang, k: ib, label: "Base for customers, brands and organization", kind: money, hint: "SG&A, advertising or revenue. Pick one and set the multiple to match."}
  - {type: input, cls: intang, k: im, label: "Multiple of the base", kind: number, hint: "1 to 3 years of SG&A, or what a brand costs per $1 of sales."}
  - {type: calc, cls: intang, k: cust, label: "Customers, brands and organization", hint: "Base × multiple"}
  - {type: input, cls: intang, k: dp, label: "Deal price per $1 of sales", kind: number, hint: "Optional check. What buyers paid for similar businesses or brands, from acquisition notes."}
  - {type: calc, cls: intang, k: dpv, label: "Customers and brands at deal prices", hint: "Deal price × revenue from section 2. Compare it with the line above."}
  - {type: total, k: tot, label: "Total assets"}
  - {type: input, k: sl, label: "(−) Spontaneous liabilities", kind: money, hint: "Payables, accrued expenses and taxes payable: interest-free funding that comes with the business. Debt goes in section 2."}
  - {type: input, k: dtl, label: "(−) Deferred tax liabilities", kind: money, hint: "At book, or less if they won't be paid for many years."}
  - {type: total, k: av, label: "Asset value", hint: "Before debt."}

  - {type: head, label: "2. Earnings power value"}
  - {type: input, k: rev, label: "Revenue", kind: money, key: true, hint: "Latest year. If it's a peak or a trough, use the average of the cycle."}
  - {type: input, k: mg, label: "Average EBIT margin over the cycle (%)", kind: percent, key: true, signed: true, hint: "A simple average of 7 to 10 years. Only use a recent trend if there's a clear economic reason for it."}
  - {type: helper, id: gw-margin}
  - {type: calc, k: sebit, label: "Sustainable EBIT", hint: "Revenue × average margin"}
  - {type: input, k: roo, label: "(−) Recurring 'one-off' charges", kind: money, hint: "Yearly average. Charges that come back most years are a cost of doing business."}
  - {type: input, k: gsp, label: "(+) Growth spending above maintenance", kind: money, hint: "Optional. R&D, marketing or hiring clearly above what keeps today's business where it is."}
  - {type: input, k: oadj, label: "(±) Other adjustments", kind: money, signed: true, hint: "Earnings of affiliates outside EBIT, prices being corrected, and so on."}
  - {type: total, k: aebit, label: "Adjusted EBIT"}
  - {type: input, k: tax, label: "Average tax rate (%)", kind: percent, key: true, hint: "The average of the last few years."}
  - {type: calc, k: nopat, label: "After-tax operating earnings"}
  - {type: input, k: da, label: "Depreciation & amortization (D&A)", kind: money, key: true, hint: "Average of the last 2 or 3 years."}
  - {type: input, k: mcx, label: "Maintenance capex", kind: money, key: true, hint: "Total capex minus what growth needed. The helper below does it Greenwald's way."}
  - {type: helper, id: gw-capex}
  - {type: calc, k: xd, label: "Excess depreciation", hint: "D&A − maintenance capex"}
  - {type: input, k: xtax, label: "Tax rate on excess depreciation (%)", kind: percent, hint: "Blank = half the tax rate. The tax shield runs out one day, so Greenwald taxes it at about half the full rate."}
  - {type: calc, k: axd, label: "After-tax excess depreciation"}
  - {type: total, k: ep, label: "Earnings power", hint: "What the business could pay out every year and stay as it is."}
  - {type: note, label: "The rate. Greenwald skips CAPM and picks the cost of equity by how risky the business is."}
  - {type: input, k: ke, label: "Cost of equity (%)", kind: percent, default: 9, hint: "Low risk 7-8%, medium 9-10%, high 11-13%."}
  - {type: input, k: kd, label: "Pre-tax cost of debt (%)", kind: percent, hint: "Yield on the company's bonds, or on bonds with the same rating."}
  - {type: input, k: debt, label: "(−) Debt", kind: money, hint: "Bank loans and bonds."}
  - {type: calc, k: dw, label: "Debt weight", hint: "Debt ÷ (debt + market cap)"}
  - {type: input, k: cap, label: "Debt weight cap (%)", kind: percent, default: 30, hint: "Past about 30%, cheap debt hides the cost of distress, so Greenwald stops counting it."}
  - {type: calc, k: wacc, label: "Cost of capital"}
  - {type: total, k: R, label: "Rate used", hint: "Rounded to a whole point. Anything more precise is false precision."}
  - {type: total, k: epvE, label: "EPV of the business", hint: "Earnings power ÷ rate used, before debt and cash."}
  - {type: input, k: opc, label: "Cash the business needs (% of revenue)", kind: percent, default: 0.5, hint: "Greenwald: 0.25% to 0.5% of revenue. The rest of the cash in section 1 is surplus."}
  - {type: calc, k: surplus, label: "(+) Surplus cash"}
  - {type: input, k: noa, label: "(+) Non-operating assets", kind: money, hint: "Spare real estate, investments, affiliates outside EBIT. At market value."}
  - {type: input, k: leg, label: "(−) Legacy liabilities", kind: money, hint: "Pension deficit, retiree medical, lawsuits, environmental clean-up."}
  - {type: input, k: pref, label: "(−) Preferred equity", kind: money}
  - {type: input, k: mi, label: "(−) Minority interests", kind: money}
  - {type: total, k: epvEq, label: "EPV (equity)"}
  - {type: total, k: epvps, label: "EPV per share"}
  - {type: calc, k: mos, label: "Margin of safety", hint: "1 − price ÷ EPV per share. Greenwald wants a third to a half."}
  - {type: calc, k: emos, label: "Margin of safety on the whole business", hint: "1 − market enterprise value ÷ EPV of the business. Read this one when debt is high."}

  - {type: head, label: "3. Assets vs earnings power"}
  - {type: calc, k: avOp, label: "Asset value without surplus cash"}
  - {type: calc, k: ratio, label: "EPV ÷ asset value"}
  - {type: test, k: case, label: "Greenwald's case", hint: "A: below 0.75x. B: 0.75x to 1.25x. C: above 1.25x."}
  - {type: calc, k: franchise, label: "Franchise value", hint: "EPV of the business − asset value"}
  - {type: calc, k: roc, label: "Return on reproduction cost", hint: "Earnings power ÷ asset value. Above the rate used means excess returns, and only a moat keeps them there."}
  - {type: total, k: avEq, label: "Asset value (equity)", hint: "Asset value + non-operating assets − debt and other claims"}
  - {type: total, k: avps, label: "Asset value per share"}

# Penman's residual income, one-year version of Penman_Residual_Income_Template.xlsx (Parts 1, 3-6).
penman_rows:
  - {type: head, label: "Market data"}
  - {type: input, k: sh, label: "Diluted shares outstanding", kind: shares, key: true, hint: "Basic shares plus in-the-money options and convertibles."}
  - {type: input, k: p, label: "Share price", kind: price, key: true, hint: "Per share, in full. Never in thousands."}

  - {type: head, label: "1. Operations and financing"}
  - {type: note, label: "Split the latest balance sheet in two: what runs the business, and how it's financed. The helper below does it line by line."}
  - {type: input, k: noa, label: "Net operating assets (NOA)", kind: money, key: true, hint: "Operating assets − operating liabilities. Goodwill stays in. Cash usually goes in financing."}
  - {type: helper, id: pn-bs}
  - {type: input, k: nfo, label: "Net financial obligations", kind: money, key: true, signed: true, hint: "Debt, leases, preferred and pension deficit, minus cash and investments. Negative if the company has more cash than debt."}
  - {type: input, k: mi, label: "Minority interest", kind: money}
  - {type: input, k: eq, label: "Book value of common equity", kind: money, signed: true, hint: "Optional, for the check below."}
  - {type: test, k: chk, label: "Check: NOA − financial obligations − minority = equity", hint: "If it's off, a line is counted twice or missing."}
  - {type: calc, k: pnoa, label: "Market value of the operations", hint: "Market cap + net financial obligations + minority interest"}
  - {type: calc, k: ebp, label: "Enterprise book-to-price", hint: "NOA ÷ market value of the operations"}

  - {type: head, label: "2. Next year's operating income"}
  - {type: input, k: oi, label: "Core operating income after tax, next year", kind: money, key: true, signed: true, hint: "Operating income without one-time items, taxed at a normal rate, with no interest. Penman trusts a year ahead; go further only with a solid reason."}
  - {type: helper, id: pn-oi}
  - {type: input, k: r, label: "Your hurdle rate (%)", kind: percent, default: 9, hint: "The return you want to earn. Penman leaves it to you; he doesn't trust CAPM to set it."}
  - {type: calc, k: rnoa, label: "Return on net operating assets (RNOA)", hint: "Operating income ÷ NOA"}
  - {type: total, k: ri, label: "Residual operating income", hint: "Operating income − hurdle × NOA. What the business earns above your hurdle."}

  - {type: head, label: "3. The no-growth value"}
  - {type: total, k: val, label: "Value per share, no growth", hint: "(NOA + residual income ÷ hurdle − financial obligations − minority) ÷ shares"}
  - {type: calc, k: mos, label: "Margin of safety", hint: "1 − price ÷ value"}
  - {type: note, label: "What you pay for, per share and as % of the price:"}
  - {type: calc, k: b1, label: "1. Book value of the business"}
  - {type: calc, k: b2, label: "2. Value of next year's residual income"}
  - {type: total, k: b3, label: "3. Speculative growth", hint: "Price − 1 − 2. The part of the price that depends on growth."}

  - {type: head, label: "4. The growth the price implies"}
  - {type: input, k: gdp, label: "Long-run GDP growth (%)", kind: percent, default: 4, hint: "Nominal, for the company's currency. Penman uses 4% for the US, on the conservative side."}
  - {type: total, k: g, label: "Implied residual income growth", hint: "The growth that makes the value equal the price. It's also the growth you need to earn your hurdle."}
  - {type: calc, k: gvs, label: "Implied growth vs GDP growth", hint: "Above GDP needs a competitive advantage to back it."}
  - {type: calc, k: irnoa, label: "RNOA the price implies with no growth", hint: "Read this one when residual income is negative: the price assumes profitability recovers."}

  - {type: head, label: "5. Your return at today's price"}
  - {type: total, k: ngr, label: "Return if growth never comes", hint: "Operating income ÷ market value of the operations. Like the yield on a bond."}
  - {type: calc, k: rgdp, label: "Return at GDP growth"}
  - {type: input, k: bond, label: "Company's bond yield (%)", kind: percent, hint: "Optional. Or the yield on corporate bonds with similar risk."}
  - {type: calc, k: vsb, label: "No-growth return vs the bond yield", hint: "Below zero, the shares pay less than the bonds if growth doesn't come."}
  - {type: helper, id: pn-profile}
