<details class="helper" id="help-bv">
  <summary>Help me calculate book value per share</summary>
  <p class="hint">Common shareholders' equity from the balance sheet (without minority interest or preferred stock), divided by the shares outstanding. Both in the same unit.</p>
  <div class="hgrid hgrid-2">
    <label for="h-eq">Shareholders' equity</label>
    <input id="h-eq" data-h="heq" type="text" inputmode="decimal" autocomplete="off">
    <label for="h-sh">Shares outstanding</label>
    <input id="h-sh" data-h="hsh" type="text" inputmode="decimal" autocomplete="off">
  </div>
  <p class="hresult">Book value per share: <output id="h-bv">–</output></p>
</details>
